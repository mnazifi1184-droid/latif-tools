<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>ورود | لاتیف تولز</title>
<style>
  /* ---------- فونت ---------- */
  @font-face {
    font-family: "Vazirmatn";
    src: url("/static/fonts/Vazirmatn-Regular.ttf");
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: "Vazirmatn";
    src: url("/static/fonts/Vazirmatn-Bold.ttf");
    font-weight: 700;
    font-display: swap;
  }

  :root {
    --bg: #0B1220;
    --bg-2: #101A2E;
    --text: #EAF0FA;
    --muted: #93A4C3;
    --accent: #F2B33D;
    --accent-2: #5B7CFA;
    --line: rgba(147, 164, 195, .22);
    --card: rgba(16, 26, 46, .66);
    --danger: #F26D6D;
    --ok: #4CC38A;
    --radius: 20px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: "Vazirmatn", "Tahoma", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    overflow-x: hidden;
    position: relative;
    line-height: 1.8;
  }

  /* ---------- پس‌زمینه: هاله‌های نور + شبکه ---------- */
  .aurora {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .aurora span {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .5;
    will-change: transform;
  }
  .aurora .a1 {
    width: 480px; height: 480px;
    background: radial-gradient(circle, #2B4CC0 0%, transparent 65%);
    top: -140px; inset-inline-start: -120px;
    animation: drift1 16s ease-in-out infinite alternate;
  }
  .aurora .a2 {
    width: 420px; height: 420px;
    background: radial-gradient(circle, #7A5BFA 0%, transparent 65%);
    bottom: -120px; inset-inline-end: -100px;
    animation: drift2 20s ease-in-out infinite alternate;
  }
  .aurora .a3 {
    width: 340px; height: 340px;
    background: radial-gradient(circle, rgba(242, 179, 61, .55) 0%, transparent 65%);
    top: 30%; inset-inline-start: 55%;
    opacity: .25;
    animation: drift3 24s ease-in-out infinite alternate;
  }
  @keyframes drift1 { to { transform: translate(70px, 50px) scale(1.12); } }
  @keyframes drift2 { to { transform: translate(-60px, -45px) scale(1.08); } }
  @keyframes drift3 { to { transform: translate(-80px, 40px) scale(1.15); } }

  .grid-overlay {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse 75% 65% at 50% 42%, #000 25%, transparent 78%);
    -webkit-mask-image: radial-gradient(ellipse 75% 65% at 50% 42%, #000 25%, transparent 78%);
    opacity: .5;
  }

  /* ---------- کارت ---------- */
  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 40px 32px 32px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 24px 70px rgba(0, 0, 0, .45);
    animation: cardIn .7s cubic-bezier(.22, 1, .36, 1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(22px) scale(.98); }
    to   { opacity: 1; transform: none; }
  }

  /* خط نورانی بالای کارت */
  .card::before {
    content: "";
    position: absolute;
    top: 0; inset-inline: 15%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(242, 179, 61, .8), transparent);
  }

  /* ---------- لوگو ---------- */
  .logo {
    width: 72px; height: 72px;
    margin: 0 auto 18px;
    border-radius: 22px;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, #5B7CFA 0%, #7A5BFA 55%, #B44BFA 100%);
    box-shadow: 0 12px 34px rgba(91, 124, 250, .4), inset 0 1px 0 rgba(255, 255, 255, .25);
  }
  .logo svg { width: 34px; height: 34px; }

  .title {
    text-align: center;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -.2px;
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin-top: 6px;
    margin-bottom: 26px;
  }

  /* ---------- تب‌ها ---------- */
  .tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: rgba(11, 18, 32, .6);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 5px;
    gap: 5px;
    margin-bottom: 22px;
  }
  .tab {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    padding: 10px 8px;
    border-radius: 10px;
    cursor: pointer;
    transition: color .2s, background .25s, box-shadow .25s;
  }
  .tab[aria-selected="true"] {
    color: #101A2E;
    background: linear-gradient(135deg, #F2B33D, #E8A028);
    box-shadow: 0 6px 18px rgba(242, 179, 61, .35);
  }
  .tab:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }

  /* ---------- فرم ---------- */
  .panel { display: none; }
  .panel.active { display: block; animation: panelIn .3s ease both; }
  @keyframes panelIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .field { position: relative; margin-bottom: 16px; }
  .field input {
    width: 100%;
    background: rgba(11, 18, 32, .55);
    border: 1px solid var(--line);
    border-radius: 13px;
    color: var(--text);
    font: inherit;
    font-size: 15px;
    padding: 14px 16px 14px 48px;
    transition: border-color .2s, box-shadow .2s, background .2s;
  }
  .field input::placeholder { color: rgba(147, 164, 195, .55); }
  .field input:focus {
    outline: none;
    border-color: var(--accent-2);
    box-shadow: 0 0 0 3px rgba(91, 124, 250, .22);
    background: rgba(11, 18, 32, .8);
  }
  .field .icon {
    position: absolute;
    inset-inline-start: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
    display: flex;
  }

  .toggle-pass {
    position: absolute;
    inset-inline-end: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: transparent;
    border: 0;
    color: var(--muted);
    cursor: pointer;
    padding: 8px;
    border-radius: 8px;
    display: flex;
  }
  .toggle-pass:hover { color: var(--text); }
  .toggle-pass:focus-visible { outline: 2px solid var(--accent-2); }

  .row-between {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 2px 2px 18px;
    font-size: 13px;
  }
  .link {
    color: var(--accent-2);
    text-decoration: none;
    background: none;
    border: 0;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    padding: 0;
  }
  .link:hover { text-decoration: underline; }
  .link:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 3px; border-radius: 4px; }

  /* ---------- دکمه اصلی ---------- */
  .btn {
    width: 100%;
    appearance: none;
    border: 0;
    border-radius: 13px;
    padding: 15px 16px;
    font: inherit;
    font-size: 16px;
    font-weight: 700;
    color: #101A2E;
    background: linear-gradient(135deg, #F2B33D 0%, #E8A028 100%);
    cursor: pointer;
    box-shadow: 0 10px 26px rgba(242, 179, 61, .3);
    transition: transform .15s, box-shadow .2s, filter .2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .btn:hover { filter: brightness(1.06); transform: translateY(-1px); box-shadow: 0 14px 30px rgba(242, 179, 61, .38); }
  .btn:active { transform: translateY(0); }
  .btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .btn:disabled { opacity: .55; cursor: not-allowed; transform: none; filter: none; }

  .btn-ghost {
    width: 100%;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text);
    box-shadow: none;
    margin-top: 12px;
  }
  .btn-ghost:hover { border-color: var(--accent-2); box-shadow: none; }

  .spinner {
    width: 18px; height: 18px;
    border: 2px solid rgba(16, 26, 46, .35);
    border-top-color: #101A2E;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    display: none;
  }
  .btn.loading .spinner { display: block; }
  .btn.loading .btn-label { opacity: .75; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- پیام ---------- */
  .msg {
    font-size: 13.5px;
    border-radius: 11px;
    padding: 11px 14px;
    margin-bottom: 16px;
    display: none;
    border: 1px solid transparent;
    line-height: 1.7;
  }
  .msg.show { display: block; animation: panelIn .25s ease both; }
  .msg.error { background: rgba(242, 109, 109, .1); border-color: rgba(242, 109, 109, .35); color: #F8A0A0; }
  .msg.ok { background: rgba(76, 195, 138, .1); border-color: rgba(76, 195, 138, .35); color: #7FDDB2; }
  .msg.info { background: rgba(91, 124, 250, .1); border-color: rgba(91, 124, 250, .35); color: #A9BBFA; }

  /* ---------- OTP ---------- */
  .otp-box {
    display: flex;
    gap: 9px;
    direction: ltr;
    justify-content: center;
    margin: 6px 0 18px;
  }
  .otp-box input {
    width: 46px;
    height: 56px;
    text-align: center;
    font-size: 22px;
    font-weight: 700;
    background: rgba(11, 18, 32, .55);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--text);
    transition: border-color .2s, box-shadow .2s, transform .15s;
  }
  .otp-box input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(242, 179, 61, .22);
    transform: translateY(-2px);
  }
  .otp-box input.filled { border-color: var(--accent-2); background: rgba(91, 124, 250, .12); }

  .otp-head { text-align: center; margin-bottom: 18px; }
  .otp-head .phone { color: var(--accent); font-weight: 700; }

  .timer-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: var(--muted);
    margin: 0 2px 16px;
  }
  .timer { font-variant-numeric: tabular-nums; }

  /* ---------- فوتر ---------- */
  .foot {
    margin-top: 22px;
    text-align: center;
    color: var(--muted);
    font-size: 12.5px;
  }
  .foot strong { color: var(--accent); font-weight: 700; }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--muted);
    font-size: 12px;
    margin: 22px 0 14px;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .back-row { display: flex; justify-content: flex-start; margin-bottom: 14px; }

  /* ---------- ریسپانسیو ---------- */
  @media (max-width: 420px) {
    .card { padding: 32px 22px 26px; border-radius: 18px; }
    .otp-box input { width: 42px; height: 52px; font-size: 20px; }
    .otp-box { gap: 7px; }
    .title { font-size: 21px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>

<div class="aurora" aria-hidden="true">
  <span class="a1"></span>
  <span class="a2"></span>
  <span class="a3"></span>
</div>
<div class="grid-overlay" aria-hidden="true"></div>

<main class="card">

  <!-- ================= تب: ورود با رمز ================= -->
  <section class="panel active" id="panel-password" aria-label="ورود با رمز عبور">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L3 7v6c0 5 3.8 8.4 9 9.6 5.2-1.2 9-4.6 9-9.6V7l-9-5z" fill="rgba(255,255,255,.9)"/>
        <path d="M9 12.5l2 2 4-4.5" stroke="#5B7CFA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1 class="title">خوش برگشتی 👋</h1>
    <p class="subtitle">برای ادامه، وارد حساب لاتیف تولز شو</p>

    <div class="msg" id="msg-password" role="alert"></div>

    <form id="form-password" novalidate>
      <div class="field">
        <label for="phone1">شماره موبایل</label>
        <span class="icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M10.5 18.5h3"/></svg>
        </span>
        <input type="tel" id="phone1" name="phone" placeholder="۰۹۱۲ ـ ـ ـ ـ ـ ـ ـ" autocomplete="username" inputmode="tel" required>
      </div>

      <div class="field">
        <label for="password">رمز عبور</label>
        <span class="icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 018 0v2.5"/></svg>
        </span>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
        <button type="button" class="toggle-pass" id="toggle-pass" aria-label="نمایش رمز">
          <svg id="eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/></svg>
        </button>
      </div>

      <div class="row-between">
        <label style="display:flex;align-items:center;gap:7px;cursor:pointer;margin:0">
          <input type="checkbox" style="accent-color:#F2B33D;width:16px;height:16px"> مرا به خاطر بسپار
        </label>
        <button type="button" class="link" id="forgot">رمزم را فراموش کردم</button>
      </div>

      <button type="submit" class="btn" id="btn-password">
        <span class="spinner" aria-hidden="true"></span>
        <span class="btn-label">ورود به حساب</span>
      </button>
    </form>

    <div class="divider">یا</div>

    <button type="button" class="btn btn-ghost" id="go-otp">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 01-9 8.4 8.6 8.6 0 01-3.5-.8L3 20l1-4.4a8.4 8.4 0 1117-4.1z"/></svg>
      ورود با کد یکبارمصرف
    </button>
  </section>

  <!-- ================= تب: ورود با OTP ================= -->
  <section class="panel" id="panel-otp" aria-label="ورود با کد یکبارمصرف">
    <div class="back-row">
      <button type="button" class="link" id="back-password">→ بازگشت به ورود با رمز</button>
    </div>

    <!-- مرحله ۱: گرفتن شماره -->
    <div id="otp-step1">
      <h1 class="title" style="font-size:21px">ورود با کد یکبارمصرف</h1>
      <p class="subtitle">شماره موبایلت را وارد کن تا کد برایت پیامک شود</p>

      <div class="msg" id="msg-otp" role="alert"></div>

      <form id="form-otp-phone" novalidate>
        <div class="field">
          <label for="phone2">شماره موبایل</label>
          <span class="icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M10.5 18.5h3"/></svg>
          </span>
          <input type="tel" id="phone2" name="phone" placeholder="۰۹۱۲ ـ ـ ـ ـ ـ ـ ـ" inputmode="tel" required>
        </div>
        <button type="submit" class="btn" id="btn-send-otp">
          <span class="spinner" aria-hidden="true"></span>
          <span class="btn-label">ارسال کد تایید</span>
        </button>
      </form>
    </div>

    <!-- مرحله ۲: وارد کردن کد -->
    <div id="otp-step2" hidden>
      <div class="otp-head">
        <h1 class="title" style="font-size:21px">کد تایید را وارد کن</h1>
        <p class="subtitle">کد ۶ رقمی به شماره <span class="phone" id="masked-phone"></span> پیامک شد</p>
      </div>

      <div class="msg" id="msg-otp2" role="alert"></div>

      <form id="form-otp-verify" novalidate>
        <div class="otp-box" id="otp-box">
          <input type="text" inputmode="numeric" maxlength="1" aria-label="رقم اول">
          <input type="text" inputmode="numeric" maxlength="1" aria-label="رقم دوم">
          <input type="text" inputmode="numeric" maxlength="1" aria-label="رقم سوم">
          <input type="text" inputmode="numeric" maxlength="1" aria-label="رقم چهارم">
          <input type="text" inputmode="numeric" maxlength="1" aria-label="رقم پنجم">
          <input type="text" inputmode="numeric" maxlength="1" aria-label="رقم ششم">
        </div>

        <div class="timer-row">
          <span>ارسال مجدد کد تا <span class="timer" id="otp-timer">۰۲:۰۰</span> دیگر</span>
          <button type="button" class="link" id="resend" disabled>ارسال دوباره کد</button>
        </div>

        <button type="submit" class="btn" id="btn-verify">
          <span class="spinner" aria-hidden="true"></span>
          <span class="btn-label">تایید و ورود</span>
        </button>
        <button type="button" class="btn btn-ghost" id="change-phone">اصلاح شماره</button>
      </form>
    </div>
  </section>

  <footer class="foot">
    <strong>لاتیف تولز</strong> — جعبه‌ابزار آنلاین، ساده و سریع
  </footer>

</main>

<script>
(function () {
  "use strict";

  var $ = function (sel) { return document.querySelector(sel); };

  /* ---------- ابزار ---------- */
  var FA = "۰۱۲۳۴۵۶۷۸۹";
  function toEn(v) {
    return String(v).replace(/[۰-۹]/g, function (d) { return FA.indexOf(d); });
  }
  function showMsg(el, type, text) {
    el.className = "msg show " + type;
    el.textContent = text;
  }
  function hideMsg(el) { el.className = "msg"; }
  function setLoading(btn, on) { btn.classList.toggle("loading", on); btn.disabled = on; }

  /* ---------- نمایش/مخفی رمز ---------- */
  $("#toggle-pass").addEventListener("click", function () {
    var inp = $("#password");
    var show = inp.type === "password";
    inp.type = show ? "text" : "password";
    this.setAttribute("aria-label", show ? "مخفی کردن رمز" : "نمایش رمز");
    inp.focus();
  });

  /* ---------- سوییچ تب ---------- */
  function showPanel(name) {
    $("#panel-password").classList.toggle("active", name === "password");
    $("#panel-otp").classList.toggle("active", name === "otp");
  }
  $("#go-otp").addEventListener("click", function () {
    var p = $("#phone1").value.trim();
    if (p) $("#phone2").value = p;
    showPanel("otp");
    otpStep(1);
  });
  $("#back-password").addEventListener("click", function () {
    stopTimer();
    showPanel("password");
  });
  $("#forgot").addEventListener("click", function () {
    showMsg($("#msg-password"), "info", "بازیابی رمز به‌زودی فعال می‌شود. فعلاً با کد یکبارمصرف وارد شو.");
  });

  /* ---------- ورود با رمز ---------- */
  $("#form-password").addEventListener("submit", function (e) {
    e.preventDefault();
    var btn = $("#btn-password");
    hideMsg($("#msg-password"));

    var phone = toEn($("#phone1").value).replace(/[\s-]/g, "");
    var pass = $("#password").value;

    if (!/^09\d{9}$/.test(phone)) {
      showMsg($("#msg-password"), "error", "شماره موبایل معتبر نیست؛ مثل ۰۹۱۲۳۴۵۶۷۸۹ واردش کن.");
      $("#phone1").focus();
      return;
    }
    if (pass.length < 8) {
      showMsg($("#msg-password"), "error", "رمز عبور باید حداقل ۸ کاراکتر باشد.");
      $("#password").focus();
      return;
    }

    setLoading(btn, true);
    fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phone: phone, password: pass })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.ok) {
          showMsg($("#msg-password"), "ok", "خوش آمدی " + data.user.name + "! در حال ورود…");
          // TODO: ریدایرکت به داشبورد بعد از تکمیل بخش اصلی
        } else {
          showMsg($("#msg-password"), "error", data.error || "ورود ناموفق بود.");
        }
      })
      .catch(function () {
        showMsg($("#msg-password"), "error", "ارتباط با سرور برقرار نشد؛ اتصال اینترنت را چک کن.");
      })
      .finally(function () { setLoading(btn, false); });
  });

  /* ---------- OTP: دو مرحله ---------- */
  var otpPhone = "", timerId = null;

  function otpStep(n) {
    $("#otp-step1").hidden = n !== 1;
    $("#otp-step2").hidden = n !== 2;
    if (n === 1) { stopTimer(); $("#phone2").focus(); }
    else { $("#otp-box input")[0] && $("#otp-box").querySelector("input").focus(); }
  }

  $("#form-otp-phone").addEventListener("submit", function (e) {
    e.preventDefault();
    var btn = $("#btn-send-otp");
    hideMsg($("#msg-otp"));

    var phone = toEn($("#phone2").value).replace(/[\s-]/g, "");
    if (!/^09\d{9}$/.test(phone)) {
      showMsg($("#msg-otp"), "error", "شماره موبایل معتبر نیست؛ مثل ۰۹۱۲۳۴۵۶۷۸۹ واردش کن.");
      $("#phone2").focus();
      return;
    }

    setLoading(btn, true);
    fetch("/api/otp/request", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phone: phone })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.ok) {
          otpPhone = phone;
          $("#masked-phone").textContent = phone.slice(0, 4) + "***" + phone.slice(-3);
          otpStep(2);
          startTimer(data.ttl || 120);
          showMsg($("#msg-otp2"), "info", "کد ارسال شد. (حالت دمو: کد " + (data.demo_code || "------") + ")");
        } else {
          showMsg($("#msg-otp"), "error", data.error || "ارسال کد ناموفق بود.");
        }
      })
      .catch(function () {
        showMsg($("#msg-otp"), "error", "ارتباط با سرور برقرار نشد؛ اتصال اینترنت را چک کن.");
      })
      .finally(function () { setLoading(btn, false); });
  });

  /* ---------- باکس‌های کد ---------- */
  var otpInputs = Array.prototype.slice.call($("#otp-box").querySelectorAll("input"));

  otpInputs.forEach(function (inp, i) {
    inp.addEventListener("input", function () {
      var v = toEn(inp.value).replace(/\D/g, "");
      inp.value = v.slice(-1);
      inp.classList.toggle("filled", !!inp.value);
      if (inp.value && i < otpInputs.length - 1) otpInputs[i + 1].focus();
      if (otpInputs.every(function (x) { return x.value; })) $("#form-otp-verify").requestSubmit();
    });
    inp.addEventListener("keydown", function (e) {
      if (e.key === "Backspace" && !inp.value && i > 0) otpInputs[i - 1].focus();
    });
    inp.addEventListener("paste", function (e) {
      e.preventDefault();
      var text = toEn((e.clipboardData || window.clipboardData).getData("text")).replace(/\D/g, "");
      otpInputs.forEach(function (x, j) {
        x.value = text[j] || "";
        x.classList.toggle("filled", !!x.value);
      });
      if (text.length === otpInputs.length) $("#form-otp-verify").requestSubmit();
      else otpInputs[Math.min(text.length, otpInputs.length - 1)].focus();
    });
  });

  /* ---------- تایمر ---------- */
  function faTime(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    var en = (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
    return en.replace(/\d/g, function (d) { return FA[+d]; });
  }
  function startTimer(ttl) {
    stopTimer();
    var left = ttl;
    $("#resend").disabled = true;
    $("#otp-timer").textContent = faTime(left);
    timerId = setInterval(function () {
      left--;
      if (left <= 0) {
        stopTimer();
        $("#otp-timer").textContent = "۰۰:۰۰";
        $("#resend").disabled = false;
        return;
      }
      $("#otp-timer").textContent = faTime(left);
    }, 1000);
  }
  function stopTimer() {
    if (timerId) { clearInterval(timerId); timerId = null; }
  }

  $("#resend").addEventListener("click", function () {
    if (!otpPhone) return;
    fetch("/api/otp/request", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phone: otpPhone })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.ok) {
          startTimer(data.ttl || 120);
          hideMsg($("#msg-otp2"));
          otpInputs.forEach(function (x) { x.value = ""; x.classList.remove("filled"); });
          otpInputs[0].focus();
          showMsg($("#msg-otp2"), "info", "کد جدید ارسال شد. (حالت دمو: کد " + (data.demo_code || "------") + ")");
        }
      })
      .catch(function () {});
  });

  $("#change-phone").addEventListener("click", function () {
    stopTimer();
    otpStep(1);
  });

  /* ---------- تایید کد ---------- */
  $("#form-otp-verify").addEventListener("submit", function (e) {
    e.preventDefault();
    var btn = $("#btn-verify");
    hideMsg($("#msg-otp2"));

    var code = otpInputs.map(function (x) { return x.value; }).join("");
    if (code.length < 6) {
      showMsg($("#msg-otp2"), "error", "کد ۶ رقمی را کامل وارد کن.");
      otpInputs[otpInputs.length - 1].focus();
      return;
    }

    setLoading(btn, true);
    fetch("/api/otp/verify", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phone: otpPhone, code: code })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.ok) {
          showMsg($("#msg-otp2"), "ok", "خوش آمدی " + data.user.name + "! در حال ورود…");
          // TODO: ریدایرکت به داشبورد بعد از تکمیل بخش اصلی
        } else {
          showMsg($("#msg-otp2"), "error", data.error || "کد تایید نشد.");
          otpInputs.forEach(function (x) { x.value = ""; x.classList.remove("filled"); });
          otpInputs[0].focus();
        }
      })
      .catch(function () {
        showMsg($("#msg-otp2"), "error", "ارتباط با سرور برقرار نشد؛ اتصال اینترنت را چک کن.");
      })
      .finally(function () { setLoading(btn, false); });
  });
})();
</script>
</body>
</html>
