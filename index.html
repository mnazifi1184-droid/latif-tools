<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>ورود | لطیف تولز</title>
<style>
  @font-face {
    font-family: "Vazirmatn";
    src: url("fonts/Vazirmatn-Regular.ttf");
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: "Vazirmatn";
    src: url("fonts/Vazirmatn-Bold.ttf");
    font-weight: 700;
    font-display: swap;
  }

  :root {
    --bg: #0B1220;
    --bg-2: #101A2E;
    --text: #EAF0FA;
    --muted: #93A4C3;
    --accent: #F2B33D;
    --accent-2: #5B7CFA;
    --line: rgba(147, 164, 195, .22);
    --card: rgba(16, 26, 46, .66);
    --danger: #F26D6D;
    --ok: #4CC38A;
    --radius: 20px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: "Vazirmatn", "Tahoma", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    overflow-x: hidden;
    position: relative;
    line-height: 1.8;
  }

  .aurora { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .aurora span { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .5; will-change: transform; }
  .aurora .a1 {
    width: 480px; height: 480px;
    background: radial-gradient(circle, #2B4CC0 0%, transparent 65%);
    top: -140px; inset-inline-start: -120px;
    animation: drift1 16s ease-in-out infinite alternate;
  }
  .aurora .a2 {
    width: 420px; height: 420px;
    background: radial-gradient(circle, #7A5BFA 0%, transparent 65%);
    bottom: -120px; inset-inline-end: -100px;
    animation: drift2 20s ease-in-out infinite alternate;
  }
  .aurora .a3 {
    width: 340px; height: 340px;
    background: radial-gradient(circle, rgba(242, 179, 61, .55) 0%, transparent 65%);
    top: 30%; inset-inline-start: 55%;
    opacity: .25;
    animation: drift3 24s ease-in-out infinite alternate;
  }
  @keyframes drift1 { to { transform: translate(70px, 50px) scale(1.12); } }
  @keyframes drift2 { to { transform: translate(-60px, -45px) scale(1.08); } }
  @keyframes drift3 { to { transform: translate(-80px, 40px) scale(1.15); } }

  .grid-overlay {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse 75% 65% at 50% 42%, #000 25%, transparent 78%);
    -webkit-mask-image: radial-gradient(ellipse 75% 65% at 50% 42%, #000 25%, transparent 78%);
    opacity: .5;
  }

  .card {
    position: relative; z-index: 1;
    width: 100%; max-width: 420px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 40px 32px 32px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 24px 70px rgba(0, 0, 0, .45);
    animation: cardIn .7s cubic-bezier(.22, 1, .36, 1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(22px) scale(.98); }
    to   { opacity: 1; transform: none; }
  }
  .card::before {
    content: "";
    position: absolute; top: 0; inset-inline: 15%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(242, 179, 61, .8), transparent);
  }

  .logo {
    width: 72px; height: 72px;
    margin: 0 auto 18px;
    border-radius: 22px;
    display: grid; place-items: center;
    background: linear-gradient(135deg, #5B7CFA 0%, #7A5BFA 55%, #B44BFA 100%);
    box-shadow: 0 12px 34px rgba(91, 124, 250, .4), inset 0 1px 0 rgba(255, 255, 255, .25);
  }
  .logo svg { width: 34px; height: 34px; }

  .title { text-align: center; font-size: 24px; font-weight: 700; letter-spacing: -.2px; }
  .subtitle { text-align: center; color: var(--muted); font-size: 14px; margin-top: 6px; margin-bottom: 26px; }

  .tabs {
    display: grid; grid-template-columns: 1fr 1fr;
    background: rgba(11, 18, 32, .6);
    border: 1px solid var(--line);
    border-radius: 14px; padding: 5px; gap: 5px;
    margin-bottom: 22px;
  }
  .tab {
    appearance: none; border: 0; background: transparent;
    color: var(--muted); font: inherit; font-size: 14px; font-weight: 700;
    padding: 10px 8px; border-radius: 10px; cursor: pointer;
    transition: color .2s, background .25s, box-shadow .25s;
  }
  .tab[aria-selected="true"] {
    color: #101A2E;
    background: linear-gradient(135deg, #F2B33D, #E8A028);
    box-shadow: 0 6px 18px rgba(242, 179, 61, .35);
  }
  .tab:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }

  .panel { display: none; }
  .panel.active { display: block; animation: panelIn .3s ease both; }
  @keyframes panelIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; }

  .field { position: relative; margin-bottom: 16px; }
  .field input {
    width: 100%;
    background: rgba(11, 18, 32, .55);
    border: 1px solid var(--line);
    border-radius: 13px;
    color: var(--text);
    font: inherit; font-size: 15px;
    padding: 14px 16px 14px 48px;
    transition: border-color .2s, box-shadow .2s, background .2s;
  }
  .field input::placeholder { color: rgba(147, 164, 195, .55); }
  .field input:focus {
    outline: none;
    border-color: var(--accent-2);
    box-shadow: 0 0 0 3px rgba(91, 124, 250, .22);
    background: rgba(11, 18, 32, .8);
  }
  .field .icon {
    position: absolute; inset-inline-start: 15px; top: 50%;
    transform: translateY(-50%);
    color: var(--muted); pointer-events: none; display: flex;
  }

  .toggle-pass {
    position: absolute; inset-inline-end: 8px; top: 50%;
    transform: translateY(-50%);
    background: transparent; border: 0; color: var(--muted);
    cursor: pointer; padding: 8px; border-radius: 8px; display: flex;
  }
  .toggle-pass:hover { color: var(--text); }
  .toggle-pass:focus-visible { outline: 2px solid var(--accent-2); }

  .row-between {
    display: flex; justify-content: space-between; align-items: center;
    margin: 2px 2px 18px; font-size: 13px;
  }
  .link {
    color: var(--accent-2); text-decoration: none;
    background: none; border: 0; font: inherit; font-size: 13px;
    cursor: pointer; padding: 0;
  }
  .link:hover { text-decoration: underline; }
  .link:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 3px; border-radius: 4px; }

  .btn {
    width: 100%;
    appearance: none; border: 0; border-radius: 13px;
    padding: 15px 16px;
    font: inherit; font-size: 16px; font-weight: 700;
    color: #101A2E;
    background: linear-gradient(135deg, #F2B33D 0%, #E8A028 100%);
    cursor: pointer;
    box-shadow: 0 10px 26px rgba(242, 179, 61, .3);
    transition: transform .15s, box-shadow .2s, filter .2s;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .btn:hover { filter: brightness(1.06); transform: translateY(-1px); box-shadow: 0 14px 30px rgba(242, 179, 61, .38); }
  .btn:active { transform: translateY(0); }
  .btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .btn:disabled { opacity: .55; cursor: not-allowed; transform: none; filter: none; }

  .btn-ghost {
    width: 100%;
    background: transparent; border: 1px solid var(--line);
    color: var(--text); box-shadow: none; margin-top: 12px;
  }
  .btn-ghost:hover { border-color: var(--accent-2); box-shadow: none; }

  .spinner {
    width: 18px; height: 18px;
    border: 2px solid rgba(16, 26, 46, .35);
    border-top-color: #101A2E;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    display: none;
  }
  .btn.loading .spinner { display: block; }
  .btn.loading .btn-label { opacity: .75; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .msg {
    font-size: 13.5px; border-radius: 11px; padding: 11px 14px;
    margin-bottom: 16px; display: none;
    border: 1px solid transparent; line-height: 1.7;
  }
  .msg.show { display: block; animation: panelIn .25s ease both; }
  .msg.error { background: rgba(242, 109, 109, .1); border-color: rgba(242, 109, 109, .35); color: #F8A0A0; }
  .msg.ok { background: rgba(76, 195, 138, .1); border-color: rgba(76, 195, 138, .35); color: #7FDDB2; }
  .msg.info { background: rgba(91, 124, 250, .1); border-color: rgba(91, 124, 250, .35); color: #A9BBFA; }

  .otp-box { display: flex; gap: 9px; direction: ltr; justify-content: center; margin: 6px 0 18px; }
  .otp-box input {
    width: 46px; height: 56px; text-align: center;
    font-size: 22px; font-weight: 700;
    background: rgba(11, 18, 32, .55);
    border: 1px solid var(--line);
    border-radius: 12px; color: var(--text);
    transition: border-color .2s, box-shadow .2s, transform .15s;
  }
  .otp-box input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(242, 179, 61, .22);
    transform: translateY(-2px);
  }
  .otp-box input.filled { border-color: var(--accent-2); background: rgba(91, 124, 250, .12); }

  .otp-head { text-align: center; margin-bottom: 18px; }
  .otp-head .phone { color: var(--accent); font-weight: 700; }

  .timer-row {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; color: var(--muted); margin: 0 2px 16px;
  }
  .timer { font-variant-numeric: tabular-nums; }

  .foot { margin-top: 22px; text-align: center; color: var(--muted); font-size: 12.5px; }
  .foot strong { color: var(--accent); font-weight: 700; }

  .divider { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; margin: 22px 0 14px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .back-row { display: flex; justify-content: flex-start; margin-bottom: 14px; }

  @media (max-width: 420px) {
    .card { padding: 32px 22px 26px; border-radius: 18px; }
    .otp-box input { width: 42px; height: 52px; font-size: 20px; }
    .otp-box { gap: 7px; }
    .title { font-size: 21px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>

<div class="aurora" aria-hidden="true">
  <span class="a1"></span>
  <span class="a2"></span>
  <span class="a3"></span>
</div>
<div class="grid-overlay" aria-hidden="true"></div>

<main class="card">

  <nav class="tabs" style="display:flex;gap:6px;margin-bottom:18px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:5px">
    <button class="tab active" id="tab-login" type="button" style="flex:1;padding:10px;border-radius:9px;border:none;background:transparent;color:inherit;font:inherit;font-weight:700;cursor:pointer">ورود</button>
    <button class="tab" id="tab-register" type="button" style="flex:1;padding:10px;border-radius:9px;border:none;background:transparent;color:inherit;font:inherit;font-weight:700;cursor:pointer">ثبت‌نام</button>
  </nav>

  <!-- ================= تب: ورود با رمز ================= -->
  <section class="panel active" id="panel-password" aria-label="ورود با نام کاربری">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L3 7v6c0 5 3.8 8.4 9 9.6 5.2-1.2 9-4.6 9-9.6V7l-9-5z" fill="rgba(255,255,255,.9)"/>
        <path d="M9 12.5l2 2 4-4.5" stroke="#5B7CFA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1 class="title">خوش برگشتی 👋</h1>
    <p class="subtitle">برای ادامه، وارد حساب لطیف تولز شو</p>

    <div class="msg" id="msg-password" role="alert"></div>

    <form id="form-password" novalidate>
      <div class="field">
        <label for="username">نام کاربری</label>
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.2-3.2 3.8-4.8 7-4.8s5.8 1.6 7 4.8"/></svg>
        </span>
        <input type="text" id="username" name="username" placeholder="مثلاً latif" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">رمز عبور</label>
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 018 0v2.5"/></svg>
        </span>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
        <button type="button" class="toggle-pass" id="toggle-pass" aria-label="نمایش رمز">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <button type="submit" class="btn" id="btn-password">
        <span class="spinner" aria-hidden="true"></span>
        <span class="btn-label">ورود به داشبورد</span>
      </button>
    </form>
  </section>

  <!-- ============ تب: ثبت‌نام ============ -->
  <section class="panel" id="panel-register" aria-label="ساخت حساب جدید">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L3 7v6c0 5 3.8 8.4 9 9.6 5.2-1.2 9-4.6 9-9.6V7l-9-5z" fill="rgba(255,255,255,.9)"/>
        <path d="M12 8v8M8 12h8" stroke="#5B7CFA" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
    </div>
    <h1 class="title">ساخت حساب جدید ✨</h1>
    <p class="subtitle">یک نام کاربری و رمز انتخاب کن؛ همین</p>

    <div class="msg" id="msg-register" role="alert"></div>

    <form id="form-register" novalidate>
      <div class="field">
        <label for="reg-username">نام کاربری</label>
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.2-3.2 3.8-4.8 7-4.8s5.8 1.6 7 4.8"/></svg>
        </span>
        <input type="text" id="reg-username" name="username" placeholder="۳ تا ۲۰ کاراکتر انگلیسی" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="reg-password">رمز عبور</label>
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 018 0v2.5"/></svg>
        </span>
        <input type="password" id="reg-password" name="password" placeholder="حداقل ۸ کاراکتر" autocomplete="new-password" required>
        <button type="button" class="toggle-pass" id="toggle-reg-pass" aria-label="نمایش رمز">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="field">
        <label for="reg-password2">تکرار رمز عبور</label>
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 018 0v2.5"/></svg>
        </span>
        <input type="password" id="reg-password2" name="password2" placeholder="همان رمز را دوباره" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn" id="btn-register">
        <span class="spinner" aria-hidden="true"></span>
        <span class="btn-label">ساخت حساب و ورود</span>
      </button>
    </form>
  </section>


  <footer class="foot">
    <strong>لطیف تولز</strong> — جعبه‌ابزار آنلاین، ساده و سریع
  </footer>

</main>


<script>
/* ==== دموی استاتیک برای GitHub Pages — شبیه‌سازی API داخل مرورگر ==== */
(function () {
  var realFetch = window.fetch.bind(window);
  function ok(obj) {
    return Promise.resolve(new Response(JSON.stringify(obj),
      { status: 200, headers: { "Content-Type": "application/json" } }));
  }
  function fail(msg, code) {
    return Promise.resolve(new Response(JSON.stringify({ ok: false, error: msg }),
      { status: code || 400, headers: { "Content-Type": "application/json" } }));
  }
  var RESET_HINT = "پایین صفحه «بازنشانی داده‌های دمو» را بزن.";
  window.fetch = function (url, opts) {
    var body = {};
    try { body = JSON.parse((opts && opts.body) || "{}"); } catch (e) {}
    if (url === "/api/register") {
      var u = String(body.username || "").trim().toLowerCase();
      if (!/^[A-Za-z0-9_.]{3,20}$/.test(u))
        return fail("نام کاربری باید ۳ تا ۲۰ کاراکتر انگلیسی، عدد، نقطه یا زیرخط باشد.");
      if (String(body.password || "").length < 8)
        return fail("رمز عبور باید حداقل ۸ کاراکتر باشد.");
      var taken = localStorage.getItem("latif_user_name");
      if (taken && taken === u)
        return fail("این نام کاربری در همین مرورگر قبلاً ثبت شده و رمزش با رمزی که الان وارد کردی یکی نیست — " + RESET_HINT);
      localStorage.setItem("latif_user_name", u);
      localStorage.setItem("latif_pass", String(body.password));
      var user1 = { username: u, name: u };
      localStorage.setItem("latif_user", JSON.stringify(user1));
      return ok({ ok: true, user: user1 });
    }
    if (url === "/api/login") {
      var u2 = String(body.username || "").trim().toLowerCase();
      var stored = localStorage.getItem("latif_user_name");
      if (!stored || stored !== u2 ||
          localStorage.getItem("latif_pass") !== String(body.password || ""))
        return fail("نام کاربری یا رمز عبور اشتباه است. اگر رمز را فراموش کردی، " + RESET_HINT);
      var user2 = { username: u2, name: u2 };
      localStorage.setItem("latif_user", JSON.stringify(user2));
      return ok({ ok: true, user: user2 });
    }
    if (url === "/api/change-password") {
      if (localStorage.getItem("latif_pass") !== String(body.current || ""))
        return fail("رمز فعلی اشتباه است.");
      if (String(body.new || "").length < 8)
        return fail("رمز جدید باید حداقل ۸ کاراکتر باشد.");
      localStorage.setItem("latif_pass", String(body.new));
      return ok({ ok: true });
    }
    return realFetch(url, opts);
  };
  /* --- دکمه بازنشانی داده‌های دمو --- */
  function addReset() {
    if (document.getElementById("demo-reset")) return;
    var a = document.createElement("a");
    a.id = "demo-reset";
    a.href = "#";
    a.textContent = "بازنشانی داده‌های دمو";
    a.style.cssText = "position:fixed;bottom:14px;left:16px;font-size:12px;" +
      "color:rgba(242,233,216,.55);text-decoration:none;z-index:9999;cursor:pointer;";
    a.addEventListener("click", function (e) {
      e.preventDefault();
      ["latif_user_name", "latif_pass", "latif_user"].forEach(function (k) {
        localStorage.removeItem(k);
      });
      window.location.reload();
    });
    document.body.appendChild(a);
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", addReset);
  } else {
    addReset();
  }
})();
</script>

<script>
(function () {
  "use strict";

  var $ = function (sel) { return document.querySelector(sel); };

  /* ---------- ابزار ---------- */
  var FA = "۰۱۲۳۴۵۶۷۸۹";
  function toEn(v) {
    return String(v).replace(/[۰-۹]/g, function (d) { return FA.indexOf(d); });
  }
  var EMAIL_RE = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;
  function showMsg(el, type, text) {
    el.className = "msg show " + type;
    el.textContent = text;
  }
  function hideMsg(el) { el.className = "msg"; }
  function setLoading(btn, on) { btn.classList.toggle("loading", on); btn.disabled = on; }

  function goDashboard() {
    window.location.href = "dashboard.html";
  }

  /* ---------- نمایش/مخفی رمز ---------- */
  $("#toggle-pass").addEventListener("click", function () {
    var inp = $("#password");
    var show = inp.type === "password";
    inp.type = show ? "text" : "password";
    this.setAttribute("aria-label", show ? "مخفی کردن رمز" : "نمایش رمز");
    inp.focus();
  });

  /* ---------- سوییچ تب ---------- */
  function showPanel(name) {
    $("#panel-password").classList.toggle("active", name === "password");
    $("#panel-register").classList.toggle("active", name === "register");
    $("#tab-login").classList.toggle("active", name === "password");
    $("#tab-register").classList.toggle("active", name === "register");
  }
  $("#tab-register").addEventListener("click", function () { showPanel("register"); });
  $("#tab-login").addEventListener("click", function () { showPanel("password"); });

  function authed(data) {
    showMsg($("#msg-password"), "ok", "خوش آمدی " + data.user.name + "! در حال رفتن به داشبورد…");
    setTimeout(goDashboard, 500);
  }

  /* ---------- ورود ---------- */
  $("#form-password").addEventListener("submit", function (e) {
    e.preventDefault();
    var btn = $("#btn-password");
    hideMsg($("#msg-password"));

    var username = toEn($("#username").value).trim();
    var password = $("#password").value;
    if (!username) return showMsg($("#msg-password"), "error", "نام کاربری را وارد کن.");
    if (!password) return showMsg($("#msg-password"), "error", "رمز عبور را وارد کن.");

    setLoading(btn, true);
    fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: username, password: password })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.ok) { authed(data); }
        else showMsg($("#msg-password"), "error", data.error || "ورود انجام نشد.");
      })
      .catch(function () {
        showMsg($("#msg-password"), "error", "ارتباط با سرور برقرار نشد؛ اتصال اینترنت را چک کن.");
      })
      .finally(function () { setLoading(btn, false); });
  });

  /* ---------- ثبت‌نام ---------- */
  $("#form-register").addEventListener("submit", function (e) {
    e.preventDefault();
    var btn = $("#btn-register");
    hideMsg($("#msg-register"));

    var username = $("#reg-username").value.trim();
    var p1 = $("#reg-password").value;
    var p2 = $("#reg-password2").value;
    if (!/^[A-Za-z0-9_.]{3,20}$/.test(username))
      return showMsg($("#msg-register"), "error", "نام کاربری باید ۳ تا ۲۰ کاراکتر انگلیسی، عدد، نقطه یا زیرخط باشد.");
    if (p1.length < 8)
      return showMsg($("#msg-register"), "error", "رمز عبور باید حداقل ۸ کاراکتر باشد.");
    if (p1 !== p2)
      return showMsg($("#msg-register"), "error", "تکرار رمز با رمز عبور یکسان نیست.");

    setLoading(btn, true);
    fetch("/api/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: username, password: p1 })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.ok) { authed(data); }
        else showMsg($("#msg-register"), "error", data.error || "ثبت‌نام انجام نشد.");
      })
      .catch(function () {
        showMsg($("#msg-register"), "error", "ارتباط با سرور برقرار نشد؛ اتصال اینترنت را چک کن.");
      })
      .finally(function () { setLoading(btn, false); });
  });

  /* ---------- نمایش/مخفی رمز (هر دو فرم) ---------- */
  function wireToggle(btnId, inpId) {
    $(btnId).addEventListener("click", function () {
      var inp = $(inpId);
      var show = inp.type === "password";
      inp.type = show ? "text" : "password";
      this.setAttribute("aria-label", show ? "مخفی کردن رمز" : "نمایش رمز");
      inp.focus();
    });
  }
  wireToggle("#toggle-pass", "#password");
  wireToggle("#toggle-reg-pass", "#reg-password");
})();
</script>
</body>
</html>
